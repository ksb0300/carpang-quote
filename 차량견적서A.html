<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a2a4a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="카팡견적서">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="카팡로고.png">
    <title>카팡 차량 견적서</title>
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6.26.0/babel.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', 'Noto Sans KR', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #eef2f7 0%, #dce3ed 100%);
            min-height: 100vh;
            padding: 16px;
            -webkit-tap-highlight-color: transparent;
        }

        /* 헤더 */
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            padding: 22px 24px;
            background: linear-gradient(135deg, #1a2a4a 0%, #2c3e6b 50%, #1a2a4a 100%);
            border-radius: 16px 16px 0 0;
            color: white;
            box-shadow: 0 4px 15px rgba(26, 42, 74, 0.3);
        }
        .header .logo-wrap {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            overflow: hidden;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .header .logo-wrap img {
            width: 56px;
            height: 56px;
            object-fit: contain;
        }
        .header-text h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1px;
        }
        .header-text p {
            font-size: 13px;
            opacity: 0.8;
            margin-top: 2px;
        }

        /* 메인 레이아웃 */
        .main-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .content-layout {
            display: flex;
            gap: 0;
        }

        /* 좌측: 견적서 */
        .quote-section {
            flex: 1;
            padding: 28px;
            border-right: 1px solid #eee;
        }
        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: #1a2a4a;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #2c3e6b;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-icon {
            width: 28px;
            height: 28px;
            background: #2c3e6b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        /* 계좌 안내 */
        .bank-info {
            margin-top: 24px;
            padding: 18px;
            background: linear-gradient(135deg, #f0f4f8, #e8edf3);
            border-radius: 12px;
            border: 2px solid #2c3e6b;
        }
        .bank-info h3 {
            font-size: 15px;
            color: #1a2a4a;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid #c8d0dc;
        }
        .bank-detail {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 6px;
        }
        .bank-name {
            background: #2c3e6b;
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 700;
        }
        .bank-account {
            font-size: 18px;
            font-weight: 800;
            color: #1a2a4a;
            letter-spacing: 0.5px;
        }
        .bank-holder {
            font-size: 14px;
            color: #5a6a7a;
            font-weight: 600;
        }

        /* 우측: 계산기 패널 */
        .calc-section {
            width: 400px;
            min-width: 360px;
            padding: 0;
            background: #f8f9fb;
            display: flex;
            flex-direction: column;
        }

        /* 탭 스타일 */
        .tab-bar {
            display: flex;
            background: #e8ecf2;
            border-bottom: 1px solid #ddd;
        }
        .tab-btn {
            flex: 1;
            padding: 14px 8px;
            border: none;
            background: transparent;
            font-size: 15px;
            font-weight: 700;
            color: #8e99a9;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .tab-btn.active {
            background: #f8f9fb;
            color: #2c3e6b;
        }
        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: #2c3e6b;
        }
        .tab-btn:not(.active):hover {
            background: #dde2ea;
        }
        .tab-content {
            padding: 24px;
            flex: 1;
            overflow-y: auto;
        }

        /* 폼 스타일 */
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #34495e;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: white;
            -webkit-appearance: none;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #2c3e6b;
            box-shadow: 0 0 0 3px rgba(44, 62, 107, 0.1);
        }
        .input-suffix {
            position: relative;
        }
        .input-suffix input {
            padding-right: 40px;
        }
        .input-suffix .suffix {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #95a5a6;
            font-size: 14px;
            font-weight: 500;
            pointer-events: none;
        }
        .form-row {
            display: flex;
            gap: 12px;
        }
        .form-row .form-group {
            flex: 1;
        }

        /* 견적 결과 */
        .result-card {
            margin-top: 20px;
            padding: 20px;
            background: linear-gradient(135deg, #f8f9fb 0%, #fff 100%);
            border-radius: 12px;
            border: 1px solid #e2e6ed;
        }
        .result-card h3 {
            font-size: 17px;
            color: #1a2a4a;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid #dee2e6;
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            font-size: 15px;
            color: #495057;
        }
        .result-row .label {
            color: #6c757d;
        }
        .result-row .value {
            font-weight: 600;
            color: #1a2a4a;
        }
        .result-row.sub-note {
            font-size: 12px;
            color: #adb5bd;
            padding: 0 0 8px 0;
            justify-content: flex-end;
        }
        .result-divider {
            border: none;
            border-top: 2px dashed #dee2e6;
            margin: 8px 0;
        }
        .result-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0 4px;
            font-size: 20px;
            font-weight: 800;
        }
        .result-total .label {
            color: #1a2a4a;
        }
        .result-total .value {
            color: #2c3e6b;
        }

        /* 할부/리스 결과 */
        .loan-result {
            margin-top: 16px;
            padding: 18px;
            background: white;
            border-radius: 12px;
            border: 2px solid #2c3e6b;
        }
        .loan-result h3 {
            font-size: 16px;
            color: #2c3e6b;
            margin-bottom: 12px;
        }
        .loan-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 14px;
            color: #495057;
        }
        .loan-row .value {
            font-weight: 600;
        }
        .loan-highlight {
            margin-top: 12px;
            padding: 14px;
            background: linear-gradient(135deg, #1a2a4a, #2c3e6b);
            border-radius: 10px;
            text-align: center;
            color: white;
        }
        .loan-highlight.lease-color {
            background: linear-gradient(135deg, #1a6b5a, #27ae60);
        }
        .loan-highlight .monthly-label {
            font-size: 13px;
            opacity: 0.9;
        }
        .loan-highlight .monthly-amount {
            font-size: 26px;
            font-weight: 800;
            margin-top: 4px;
        }
        .loan-highlight .monthly-unit {
            font-size: 14px;
            font-weight: 400;
        }

        .lease-border {
            border-color: #27ae60;
        }
        .lease-border h3 {
            color: #1a6b5a;
        }

        /* 계산 버튼 */
        .calc-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1a2a4a, #2c3e6b);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            margin-top: 8px;
        }
        .calc-btn:active {
            transform: scale(0.98);
        }
        .calc-btn:hover {
            box-shadow: 0 4px 12px rgba(26, 42, 74, 0.4);
        }
        .apply-btns {
            display: flex;
            gap: 8px;
            margin-top: 14px;
        }
        .apply-btns .calc-btn {
            margin-top: 0;
            font-size: 13px;
            padding: 10px 8px;
        }
        .apply-btns .calc-btn.lease-btn {
            background: linear-gradient(135deg, #1a6b5a, #27ae60);
        }

        /* 푸터 */
        .footer {
            text-align: center;
            padding: 16px;
            background: #f8f9fb;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: #adb5bd;
        }

        /* 스케줄 테이블 */
        .schedule-toggle {
            width: 100%;
            padding: 10px;
            background: #f0f2f5;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            font-size: 14px;
            color: #495057;
            cursor: pointer;
            margin-top: 12px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .schedule-toggle:hover {
            background: #e2e6ea;
        }
        .schedule-table {
            width: 100%;
            margin-top: 12px;
            border-collapse: collapse;
            font-size: 11px;
        }
        .schedule-table th {
            background: #2c3e6b;
            color: white;
            padding: 8px 4px;
            text-align: center;
            font-weight: 600;
            position: sticky;
            top: 0;
        }
        .schedule-table th.lease-th {
            background: #1a6b5a;
        }
        .schedule-table td {
            padding: 6px 4px;
            text-align: right;
            border-bottom: 1px solid #f0f0f0;
        }
        .schedule-table tr:nth-child(even) {
            background: #fafafa;
        }
        .schedule-scroll {
            max-height: 300px;
            overflow-y: auto;
            border-radius: 8px;
            border: 1px solid #dee2e6;
        }

        /* 리스 타입 선택 */
        .lease-type-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .lease-type-btn {
            flex: 1;
            padding: 10px 6px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: white;
            font-size: 13px;
            font-weight: 600;
            color: #7f8c8d;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .lease-type-btn.active {
            border-color: #27ae60;
            color: #1a6b5a;
            background: #e8f8f0;
        }

        /* 반응형 - 태블릿 세로 */
        @media (max-width: 900px) {
            .content-layout {
                flex-direction: column;
            }
            .quote-section {
                border-right: none;
                border-bottom: 1px solid #eee;
            }
            .calc-section {
                width: 100%;
                min-width: auto;
            }
        }

        /* 인쇄 스타일 */
        @media print {
            body { background: white; padding: 0; }
            .main-wrapper { box-shadow: none; }
            .calc-btn, .schedule-toggle, .tab-bar, .apply-btns { display: none; }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        function CarQuoteApp() {
            // 견적서 상태
            const [carPrice, setCarPrice] = React.useState('');
            const [insurancePrice, setInsurancePrice] = React.useState('');
            const [showBank, setShowBank] = React.useState(false);

            // 관리자 모드 (로고 3번 탭)
            const [adminMode, setAdminMode] = React.useState(false);
            const tapCount = React.useRef(0);
            const tapTimer = React.useRef(null);

            const handleLogoTap = () => {
                tapCount.current += 1;
                clearTimeout(tapTimer.current);
                tapTimer.current = setTimeout(() => { tapCount.current = 0; }, 1000);
                if (tapCount.current >= 3) {
                    setAdminMode(!adminMode);
                    tapCount.current = 0;
                }
            };

            // 탭 상태
            const [activeTab, setActiveTab] = React.useState('installment');

            // 할부 계산기 상태
            const [loanAmount, setLoanAmount] = React.useState('0');
            const [interestRate, setInterestRate] = React.useState('0');
            const [loanMonths, setLoanMonths] = React.useState('60');
            const [showSchedule, setShowSchedule] = React.useState(false);

            // 리스 계산기 상태
            const [leaseType, setLeaseType] = React.useState('operating');
            const [leaseCarPrice, setLeaseCarPrice] = React.useState('0');
            const [leaseAdvance, setLeaseAdvance] = React.useState('0');
            const [leaseResidual, setLeaseResidual] = React.useState('30');
            const [leaseRate, setLeaseRate] = React.useState('9');
            const [leaseMonths, setLeaseMonths] = React.useState('60');
            const [showLeaseSchedule, setShowLeaseSchedule] = React.useState(false);

            // 견적 상수
            const FIXED_SALE_FEE = 440000;
            const TRANSFER_RATE = 0.075;

            // 견적 계산
            const calculateQuote = () => {
                const price = Number(carPrice);
                if (!price) return null;
                const transferFee = Math.floor(price * TRANSFER_RATE);
                const insurance = Number(insurancePrice) || 0;
                const total = price + FIXED_SALE_FEE + transferFee + insurance;
                return { carPrice: price, saleFee: FIXED_SALE_FEE, transferFee, insurance, total };
            };

            // 원리금균등상환 계산 (할부)
            const calculateLoan = () => {
                const P = Number(loanAmount);
                const annualRate = Number(interestRate);
                const n = Number(loanMonths);
                if (!P || !annualRate || !n) return null;

                const r = annualRate / 100 / 12;
                const monthly = P * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1);
                const totalPayment = monthly * n;
                const totalInterest = totalPayment - P;

                let balance = P;
                const schedule = [];
                for (let i = 1; i <= n; i++) {
                    const interest = balance * r;
                    const principal = monthly - interest;
                    balance -= principal;
                    schedule.push({
                        month: i,
                        payment: monthly,
                        principal,
                        interest,
                        balance: Math.max(balance, 0)
                    });
                }
                return { monthly, totalPayment, totalInterest, schedule };
            };

            // 리스 계산
            const calculateLease = () => {
                const carP = Number(leaseCarPrice);
                const annualRate = Number(leaseRate);
                const n = Number(leaseMonths);
                if (!carP || !annualRate || !n) return null;

                const advanceAmount = Number(leaseAdvance) || 0;
                const residualAmount = leaseType === 'operating' ? carP * (Number(leaseResidual) / 100) : 0;
                const leasePrincipal = carP - advanceAmount;
                const r = annualRate / 100 / 12;

                const compoundFactor = Math.pow(1 + r, n);
                const monthly = (leasePrincipal * compoundFactor - residualAmount) * r / (compoundFactor - 1);

                const totalPayment = monthly * n + advanceAmount;
                const totalInterest = totalPayment - (carP - residualAmount);

                let balance = leasePrincipal;
                const schedule = [];
                for (let i = 1; i <= n; i++) {
                    const interest = balance * r;
                    const principal = monthly - interest;
                    balance -= principal;
                    schedule.push({
                        month: i,
                        payment: monthly,
                        principal,
                        interest,
                        balance: Math.max(balance, 0)
                    });
                }

                return {
                    monthly,
                    advanceAmount,
                    residualAmount,
                    leasePrincipal,
                    totalPayment,
                    totalInterest,
                    schedule
                };
            };

            const quoteResult = calculateQuote();
            const loanResult = calculateLoan();
            const leaseResult = calculateLease();

            const applyToLoan = () => {
                if (quoteResult) {
                    setLoanAmount(String(quoteResult.total));
                    setActiveTab('installment');
                }
            };
            const applyToLease = () => {
                if (quoteResult) {
                    setLeaseCarPrice(String(quoteResult.carPrice));
                    setActiveTab('lease');
                }
            };

            const fmtWon = (num) => Math.round(num).toLocaleString();

            return (
                <div className="main-wrapper">
                    {/* 헤더 */}
                    <div className="header">
                        <div className="logo-wrap" onClick={handleLogoTap} style={{cursor: 'pointer'}}>
                            <img src="카팡로고.png" alt="카팡 로고" />
                        </div>
                        <div className="header-text">
                            <h1>CARPANG 견적서</h1>
                            <p>{adminMode ? '관리자 모드' : '신뢰할 수 있는 중고차 거래 파트너'}</p>
                        </div>
                    </div>

                    <div className="content-layout">
                        {/* 좌측: 견적서 */}
                        <div className="quote-section">
                            <div className="section-title">
                                <div className="section-icon">$</div>
                                차량 견적 계산
                            </div>

                            <div className="form-group">
                                <label>차량 가격</label>
                                <div className="input-suffix">
                                    <input
                                        type="number"
                                        value={carPrice}
                                        onChange={(e) => setCarPrice(e.target.value)}
                                        placeholder="차량 가격을 입력하세요"
                                        inputMode="numeric"
                                    />
                                    <span className="suffix">원</span>
                                </div>
                            </div>

                            <div className="form-group">
                                <label>성능보증보험료</label>
                                <div className="input-suffix">
                                    <input
                                        type="number"
                                        value={insurancePrice}
                                        onChange={(e) => setInsurancePrice(e.target.value)}
                                        placeholder="성능보증보험료를 입력하세요"
                                        inputMode="numeric"
                                    />
                                    <span className="suffix">원</span>
                                </div>
                            </div>

                            {quoteResult && (
                                <div className="result-card">
                                    <h3>견적 상세내역</h3>
                                    <div className="result-row">
                                        <span className="label">차량가격</span>
                                        <span className="value">{quoteResult.carPrice.toLocaleString()} 원</span>
                                    </div>
                                    <div className="result-row">
                                        <span className="label">차량매도비</span>
                                        <span className="value">{quoteResult.saleFee.toLocaleString()} 원</span>
                                    </div>
                                    <div className="result-row">
                                        <span className="label">이전비 (7.5%)</span>
                                        <span className="value">{quoteResult.transferFee.toLocaleString()} 원</span>
                                    </div>
                                    <div className="result-row sub-note">
                                        ※ 세금납부 후 차액은 환급됩니다
                                    </div>
                                    <div className="result-row">
                                        <span className="label">성능보증보험료</span>
                                        <span className="value">{quoteResult.insurance.toLocaleString()} 원</span>
                                    </div>
                                    <hr className="result-divider" />
                                    <div className="result-total">
                                        <span className="label">총 견적금액</span>
                                        <span className="value">{quoteResult.total.toLocaleString()} 원</span>
                                    </div>
                                    <div className="apply-btns">
                                        <button className="calc-btn" onClick={applyToLoan}>
                                            할부 계산 →
                                        </button>
                                        <button className="calc-btn lease-btn" onClick={applyToLease}>
                                            리스 계산 →
                                        </button>
                                    </div>
                                </div>
                            )}

                            <button className="schedule-toggle" style={{marginTop: '24px'}} onClick={() => setShowBank(!showBank)}>
                                {showBank ? '▲ 입금 계좌 안내 닫기' : '▼ 입금 계좌 안내'}
                            </button>
                            {showBank && (
                                <div className="bank-info">
                                    <div className="bank-detail">
                                        <span className="bank-name">부산은행</span>
                                        <span className="bank-account">101-2094-4765-02</span>
                                    </div>
                                    <div className="bank-holder">예금주: 카팡모터스 김상혁</div>
                                </div>
                            )}
                        </div>

                        {/* 우측: 할부/리스 탭 */}
                        <div className="calc-section">
                            <div className="tab-bar">
                                <button
                                    className={'tab-btn' + (activeTab === 'installment' ? ' active' : '')}
                                    onClick={() => setActiveTab('installment')}
                                >
                                    할부 계산기
                                </button>
                                <button
                                    className={'tab-btn' + (activeTab === 'lease' ? ' active' : '')}
                                    onClick={() => setActiveTab('lease')}
                                >
                                    리스 계산기
                                </button>
                            </div>

                            {/* ===== 할부 탭 ===== */}
                            {activeTab === 'installment' && (
                                <div className="tab-content">
                                    <p style={{fontSize: '13px', color: '#7f8c8d', marginBottom: '16px'}}>
                                        원리금균등상환 방식
                                    </p>

                                    <div className="form-group">
                                        <label>할부 원금</label>
                                        <div className="input-suffix">
                                            <input
                                                type="number"
                                                value={loanAmount}
                                                onChange={(e) => setLoanAmount(e.target.value)}
                                                placeholder="할부 원금"
                                                inputMode="numeric"
                                            />
                                            <span className="suffix">원</span>
                                        </div>
                                    </div>

                                    <div className="form-row">
                                        <div className="form-group">
                                            <label>연 이율</label>
                                            <div className="input-suffix">
                                                <input
                                                    type="number"
                                                    value={interestRate}
                                                    onChange={(e) => setInterestRate(e.target.value)}
                                                    placeholder="이율"
                                                    inputMode="decimal"
                                                    step="0.1"
                                                />
                                                <span className="suffix">%</span>
                                            </div>
                                        </div>
                                        <div className="form-group">
                                            <label>할부 기간</label>
                                            <select
                                                value={loanMonths}
                                                onChange={(e) => setLoanMonths(e.target.value)}
                                            >
                                                <option value="12">12개월</option>
                                                <option value="24">24개월</option>
                                                <option value="36">36개월</option>
                                                <option value="48">48개월</option>
                                                <option value="60">60개월</option>
                                                <option value="72">72개월</option>
                                                <option value="84">84개월</option>
                                            </select>
                                        </div>
                                    </div>

                                    {loanResult && (
                                        <React.Fragment>
                                            <div className="loan-highlight">
                                                <div className="monthly-label">월 납입금액</div>
                                                <div className="monthly-amount">
                                                    {fmtWon(loanResult.monthly)}
                                                    <span className="monthly-unit"> 원</span>
                                                </div>
                                            </div>

                                            <div className="loan-result">
                                                <h3>할부 상세 정보</h3>
                                                <div className="loan-row">
                                                    <span>할부 원금</span>
                                                    <span className="value">{Number(loanAmount).toLocaleString()} 원</span>
                                                </div>
                                                <div className="loan-row">
                                                    <span>총 이자</span>
                                                    <span className="value">{fmtWon(loanResult.totalInterest)} 원</span>
                                                </div>
                                                <div className="loan-row">
                                                    <span>총 상환금액</span>
                                                    <span className="value">{fmtWon(loanResult.totalPayment)} 원</span>
                                                </div>
                                                <div className="loan-row">
                                                    <span>상환 방식</span>
                                                    <span className="value">원리금균등상환</span>
                                                </div>
                                                <p style={{fontSize: '11px', color: '#adb5bd', marginTop: '10px', whiteSpace: 'nowrap'}}>※ 실제 금리 및 조건은 금융사별로 상이하며, 본 계산은 참고용입니다.</p>
                                            </div>

                                            <button
                                                className="schedule-toggle"
                                                onClick={() => setShowSchedule(!showSchedule)}
                                            >
                                                {showSchedule ? '▲ 상환 스케줄 닫기' : '▼ 상환 스케줄 보기'}
                                            </button>

                                            {showSchedule && (
                                                <div className="schedule-scroll">
                                                    <table className="schedule-table">
                                                        <thead>
                                                            <tr>
                                                                <th>회차</th>
                                                                <th>월납입금</th>
                                                                <th>원금</th>
                                                                <th>이자</th>
                                                                <th>잔금</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                                                            {loanResult.schedule.map((row) => (
                                                                <tr key={row.month}>
                                                                    <td style={{textAlign: 'center'}}>{row.month}</td>
                                                                    <td>{fmtWon(row.payment)}</td>
                                                                    <td>{fmtWon(row.principal)}</td>
                                                                    <td>{fmtWon(row.interest)}</td>
                                                                    <td>{fmtWon(row.balance)}</td>
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            )}
                                        </React.Fragment>
                                    )}
                                </div>
                            )}

                            {/* ===== 리스 탭 ===== */}
                            {activeTab === 'lease' && (
                                <div className="tab-content">

                                    <div className="form-group">
                                        <label>차량가격</label>
                                        <div className="input-suffix">
                                            <input
                                                type="number"
                                                value={leaseCarPrice}
                                                onChange={(e) => setLeaseCarPrice(e.target.value)}
                                                placeholder="차량가격"
                                                inputMode="numeric"
                                            />
                                            <span className="suffix">원</span>
                                        </div>
                                    </div>

                                    <div className="form-group">
                                        <label>선수금</label>
                                        <div className="input-suffix">
                                            <input
                                                type="number"
                                                value={leaseAdvance}
                                                onChange={(e) => setLeaseAdvance(e.target.value)}
                                                placeholder="선수금"
                                                inputMode="numeric"
                                            />
                                            <span className="suffix">원</span>
                                        </div>
                                    </div>
                                    {leaseType === 'operating' && (
                                        <div className="form-group">
                                            <label>잔존가치</label>
                                            <div className="input-suffix">
                                                <input
                                                    type="number"
                                                    value={leaseResidual}
                                                    onChange={(e) => setLeaseResidual(e.target.value)}
                                                    placeholder="잔존가치"
                                                    inputMode="decimal"
                                                    step="5"
                                                />
                                                <span className="suffix">%</span>
                                            </div>
                                        </div>
                                    )}

                                    <div className="form-row">
                                        {adminMode && (
                                            <div className="form-group">
                                                <label>연 이율</label>
                                                <div className="input-suffix">
                                                    <input
                                                        type="number"
                                                        value={leaseRate}
                                                        onChange={(e) => setLeaseRate(e.target.value)}
                                                        placeholder="이율"
                                                        inputMode="decimal"
                                                        step="0.1"
                                                        style={{borderColor: '#e74c3c', background: '#fff5f5'}}
                                                    />
                                                    <span className="suffix">%</span>
                                                </div>
                                            </div>
                                        )}
                                        <div className="form-group">
                                            <label>리스 기간</label>
                                            <select
                                                value={leaseMonths}
                                                onChange={(e) => setLeaseMonths(e.target.value)}
                                            >
                                                <option value="24">24개월</option>
                                                <option value="36">36개월</option>
                                                <option value="48">48개월</option>
                                                <option value="60">60개월</option>
                                            </select>
                                        </div>
                                    </div>

                                    {leaseResult && (
                                        <React.Fragment>
                                            <div className="loan-highlight lease-color">
                                                <div className="monthly-label">월 리스료</div>
                                                <div className="monthly-amount">
                                                    {fmtWon(leaseResult.monthly)}
                                                    <span className="monthly-unit"> 원</span>
                                                </div>
                                            </div>

                                            <div className="loan-result lease-border">
                                                <h3>리스 상세 정보</h3>
                                                <div className="loan-row">
                                                    <span>차량가격</span>
                                                    <span className="value">{Number(leaseCarPrice).toLocaleString()} 원</span>
                                                </div>
                                                <div className="loan-row">
                                                    <span>선수금</span>
                                                    <span className="value">{fmtWon(leaseResult.advanceAmount)} 원</span>
                                                </div>
                                                <div className="loan-row">
                                                    <span>리스원금</span>
                                                    <span className="value">{fmtWon(leaseResult.leasePrincipal)} 원</span>
                                                </div>
                                                {leaseType === 'operating' && (
                                                    <div className="loan-row">
                                                        <span>잔존가치 ({leaseResidual}%)</span>
                                                        <span className="value">{fmtWon(leaseResult.residualAmount)} 원</span>
                                                    </div>
                                                )}
                                                <div className="loan-row">
                                                    <span>총 이자</span>
                                                    <span className="value">{fmtWon(leaseResult.totalInterest)} 원</span>
                                                </div>
                                                <div className="loan-row">
                                                    <span>총 납입금액</span>
                                                    <span className="value">{fmtWon(leaseResult.totalPayment)} 원</span>
                                                </div>
                                                <p style={{fontSize: '11px', color: '#adb5bd', marginTop: '10px', whiteSpace: 'nowrap'}}>※ 실제 금리 및 조건은 금융사별로 상이하며, 본 계산은 참고용입니다.</p>
                                            </div>

                                            <button
                                                className="schedule-toggle"
                                                onClick={() => setShowLeaseSchedule(!showLeaseSchedule)}
                                            >
                                                {showLeaseSchedule ? '▲ 리스 스케줄 닫기' : '▼ 리스 스케줄 보기'}
                                            </button>

                                            {showLeaseSchedule && (
                                                <div className="schedule-scroll">
                                                    <table className="schedule-table">
                                                        <thead>
                                                            <tr>
                                                                <th className="lease-th">회차</th>
                                                                <th className="lease-th">월리스료</th>
                                                                <th className="lease-th">원금</th>
                                                                <th className="lease-th">이자</th>
                                                                <th className="lease-th">잔액</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                                                            {leaseResult.schedule.map((row) => (
                                                                <tr key={row.month}>
                                                                    <td style={{textAlign: 'center'}}>{row.month}</td>
                                                                    <td>{fmtWon(row.payment)}</td>
                                                                    <td>{fmtWon(row.principal)}</td>
                                                                    <td>{fmtWon(row.interest)}</td>
                                                                    <td>{fmtWon(row.balance)}</td>
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            )}
                                        </React.Fragment>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>

                    <div className="footer">
                        &copy; CARPANG. 본 견적서는 참고용이며, 실제 금액은 상이할 수 있습니다.
                    </div>
                </div>
            );
        }

        ReactDOM.render(<CarQuoteApp />, document.getElementById('root'));
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>
</body>
</html>
